<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Text Detection Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="max-w-3xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
    <header class="border-b border-slate-800 pb-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></div>
          <h1 class="text-2xl font-bold tracking-tight">AI Text Detection Engine</h1>
        </div>
        <span class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 font-mono">v1.0.0</span>
      </div>
      <p class="text-sm text-slate-400 mt-2">
        Analyze writing patterns using fine-tuned transformer classification (<code class="text-slate-300 font-mono">RobertaForSequenceClassification</code>).
      </p>
    </header>

    <div class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <label for="inputText" class="text-xs font-semibold uppercase tracking-wider text-slate-400">
          Source Text (min 5 characters)
        </label>
        <div class="flex items-center space-x-2 text-xs">
          <button type="button" onclick="loadSample('human')" class="text-indigo-400 hover:text-indigo-300 underline underline-offset-2">
            Load Human Sample
          </button>
          <span class="text-slate-600">|</span>
          <button type="button" onclick="loadSample('ai')" class="text-indigo-400 hover:text-indigo-300 underline underline-offset-2">
            Load AI Sample
          </button>
          <span class="text-slate-600">|</span>
          <button type="button" onclick="clearText()" class="text-slate-400 hover:text-slate-200">
            Clear
          </button>
        </div>
      </div>

      <textarea id="inputText" rows="7" placeholder="Paste or type text to analyze here..."
        class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"></textarea>

      <div class="flex items-center justify-between text-xs text-slate-500 px-1">
        <div class="space-x-4">
          <span id="charCount">0 characters</span>
          <span id="wordCount">0 words</span>
        </div>
        <button onclick="analyzeText()" id="submitBtn"
          class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition shadow-lg shadow-indigo-600/20 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
          Analyze Text
        </button>
      </div>
    </div>

    <!-- Error Box -->
    <div id="errorBox" class="hidden p-4 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-400 text-sm">
      <div class="flex items-center space-x-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <span id="errorMessage">Error analyzing text.</span>
      </div>
    </div>

    <!-- Result Box -->
    <div id="resultBox" class="hidden p-5 rounded-xl border transition-all duration-300">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Classification Verdict</span>
          <div id="verdictLabel" class="text-2xl font-bold mt-1 tracking-tight"></div>
        </div>
        <div class="sm:text-right">
          <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Confidence Score</span>
          <div id="confidenceScore" class="text-2xl font-mono font-bold mt-1"></div>
        </div>
      </div>

      <div class="mt-5 space-y-2">
        <div class="flex justify-between text-xs text-slate-400">
          <span>Human-Written: <strong id="humanScore" class="text-slate-200">0%</strong></span>
          <span>AI-Generated: <strong id="aiScore" class="text-slate-200">0%</strong></span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5">
          <div id="probBar" class="h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const samples = {
      human: "Last weekend, my brother and I decided to hike up Mount Tamalpais early in the morning. The fog was remarkably dense as we started on the Matt Davis trail, making it almost impossible to see the turns ahead. By midday, though, the sun broke through and revealed panoramic views of the Pacific coast that made every blister worthwhile.",
      ai: "Artificial intelligence has rapidly transformed modern communication methodologies across diverse industries. By utilizing deep learning architectures such as transformers, natural language processing models can produce coherent, contextually nuanced syntactical structures that closely resemble genuine human discourse."
    };

    const textarea = document.getElementById("inputText");
    const charCount = document.getElementById("charCount");
    const wordCount = document.getElementById("wordCount");
    const errorBox = document.getElementById("errorBox");
    const errorMessage = document.getElementById("errorMessage");
    const resultBox = document.getElementById("resultBox");
    const submitBtn = document.getElementById("submitBtn");

    function updateCounts() {
      const text = textarea.value;
      charCount.innerText = `${text.length} characters`;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      wordCount.innerText = `${words} words`;
    }

    textarea.addEventListener("input", updateCounts);

    function loadSample(type) {
      textarea.value = samples[type] || "";
      updateCounts();
      hideError();
    }

    function clearText() {
      textarea.value = "";
      updateCounts();
      resultBox.classList.add("hidden");
      hideError();
    }

    function showError(msg) {
      errorMessage.innerText = msg;
      errorBox.classList.remove("hidden");
    }

    function hideError() {
      errorBox.classList.add("hidden");
    }

    async function analyzeText() {
      const text = textarea.value.trim();
      hideError();

      if (text.length < 5) {
        showError("Please enter at least 5 characters to analyze.");
        return;
      }

      submitBtn.innerText = "Analyzing...";
      submitBtn.disabled = true;

      try {
        const res = await fetch("/api/v1/detect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Failed to analyze text.");
        }

        const verdictLabel = document.getElementById("verdictLabel");
        const confidenceScore = document.getElementById("confidenceScore");
        const probBar = document.getElementById("probBar");
        const humanScore = document.getElementById("humanScore");
        const aiScore = document.getElementById("aiScore");

        resultBox.classList.remove("hidden");
        verdictLabel.innerText = data.verdict;
        confidenceScore.innerText = `${data.confidence}%`;
        humanScore.innerText = `${data.probabilities.human}%`;
        aiScore.innerText = `${data.probabilities.ai}%`;

        if (data.is_ai) {
          resultBox.className = "p-5 rounded-xl border border-rose-500/40 bg-rose-950/20 text-rose-400";
          probBar.className = "h-2 rounded-full bg-rose-500";
          probBar.style.width = `${data.probabilities.ai}%`;
        } else {
          resultBox.className = "p-5 rounded-xl border border-emerald-500/40 bg-emerald-950/20 text-emerald-400";
          probBar.className = "h-2 rounded-full bg-emerald-500";
          probBar.style.width = `${data.probabilities.human}%`;
        }
      } catch (err) {
        showError(err.message || "Connection failed. Please ensure the backend server is running.");
      } finally {
        submitBtn.innerText = "Analyze Text";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
