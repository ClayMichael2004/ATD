services:
  atd-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: atd-api:latest
    container_name: atd-detector-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Mount saved_ai_detector directory so model weights are available without bloating image
      - ./saved_ai_detector:/app/saved_ai_detector:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
